[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cuekb"
version = "0.1.0"
description = "Cue-driven evidence retrieval knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "opensearch-py>=2.8,<4",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ingestion = ["docling>=2.25,<3", "transformers>=5.10,<6"]
dev = ["httpx>=0.28,<1", "pytest>=9.0.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
cuekb-worker = "cuekb.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cuekb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
