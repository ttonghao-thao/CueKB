services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cuekb
      POSTGRES_USER: cuekb
      POSTGRES_PASSWORD: cuekb
    ports:
      - "5432:5432"
    volumes:
      - cuekb_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuekb -d cuekb"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.0.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - cuekb_search:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  cuekb_pg:
  cuekb_search:
